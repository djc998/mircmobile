# Cloudflare Worker that stores short-lived, encrypted pictures.
# Deploy steps are in README.md.
name = "irc-pictures"
main = "src/index.js"
compatibility_date = "2026-11-01"

# Served at share.ircage.com (Cloudflare creates its DNS record and
# certificate; ircage.com's DNS is on Cloudflare). The workers.dev address
# stays on too, for apps built before the move (1.0.0 and earlier).
workers_dev = true
routes = [{ pattern = "share.ircage.com", custom_domain = true }]

[[r2_buckets]]
binding = "PICTURES"
bucket_name = "irc-pictures"

# Clean-up of expired pictures every 15 minutes.
[triggers]
crons = ["*/15 * * * *"]

# At most 20 uploads a minute from one address.
[[ratelimits]]
name = "UPLOAD_LIMIT"
namespace_id = "1001"
simple = { limit = 20, period = 60 }

# Voice and video calls: one Durable Object per call (see src/calls.js).
[[durable_objects.bindings]]
name = "CALLS"
class_name = "CallRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["CallRoom"]

# At most 10 new calls a minute from one address.
[[ratelimits]]
name = "CALL_LIMIT"
namespace_id = "1002"
simple = { limit = 10, period = 60 }
