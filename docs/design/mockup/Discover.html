<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>IRCade discover rooms</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#8B8BFF;text-decoration:none}a:hover{color:#B0B0FF}
button{font:inherit;cursor:pointer}
input{font:inherit}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</helmet>
<div style="width: 390px; height: 844px; display: flex; flex-direction: column; background: #0F1117; color: #E8EAF2; font-family: Inter, system-ui, sans-serif; overflow: hidden">
  <div style="padding: 60px 20px 0; display: flex; align-items: center">
    <div style="font-size: 30px; font-weight: 700; letter-spacing: -0.5px; flex: 1">Discover</div>
  </div>
  <div style="display: flex; gap: 6px; padding: 12px 20px 0">
    <sc-for list="{{ networks }}" as="n" hint-placeholder-count="3">
      <button onClick="{{ n.pick }}" style="height: 30px; border-radius: 15px; border: 1px solid {{n.border}}; background: {{n.bg}}; color: {{n.fg}}; font-size: 13px; font-weight: 600; padding: 0 12px">{{ n.label }}</button>
    </sc-for>
  </div>
  <label style="margin: 12px 20px 0; height: 44px; border-radius: 12px; background: #171A23; border: 1px solid #262B37; display: flex; align-items: center; gap: 8px; padding: 0 12px; color: #8E94A6">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
    <span class="sr">Search rooms</span>
    <input placeholder="Search 4,812 rooms" style="flex: 1; border: 0; outline: none; background: transparent; font-size: 15px; color: #E8EAF2">
  </label>
  <div style="display: flex; gap: 8px; padding: 14px 20px 4px; overflow: hidden">
    <sc-for list="{{ cats }}" as="c" hint-placeholder-count="5">
      <button onClick="{{ c.pick }}" style="flex-shrink: 0; height: 34px; border-radius: 10px; border: 0; background: {{c.bg}}; color: {{c.fg}}; font-size: 13px; font-weight: 600; padding: 0 12px">{{ c.label }}</button>
    </sc-for>
  </div>

  <div style="flex: 1; min-height: 0; overflow: auto; padding: 10px 20px 12px; display: flex; flex-direction: column; gap: 10px">
    <sc-for list="{{ rooms }}" as="r" hint-placeholder-count="4">
      <article style="background: #171A23; border: 1px solid #262B37; border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 10px">
        <div style="display: flex; align-items: center; gap: 12px">
          <span style="width: 44px; height: 44px; border-radius: 12px; background: {{r.avBg}}; color: {{r.avFg}}; font-size: 19px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0">{{ r.initial }}</span>
          <div style="flex: 1; min-width: 0">
            <div style="font-size: 16px; font-weight: 700">{{ r.name }}</div>
            <div style="display: flex; align-items: center; gap: 6px; font-size: 12px; color: #8E94A6; margin-top: 2px">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="9" cy="8" r="4"></circle><path d="M2 21a7 7 0 0 1 14 0"></path></svg>{{ r.users }} people
              <span style="width: 3px; height: 3px; border-radius: 2px; background: #8E94A6"></span>{{ r.cat }}
              <sc-if value="{{ r.lively }}" hint-placeholder-val="{{ false }}"><span style="width: 3px; height: 3px; border-radius: 2px; background: #8E94A6"></span><span style="color: #3DD68C">Busy now</span></sc-if>
            </div>
          </div>
          <button onClick="{{ r.toggle }}" style="height: 34px; border-radius: 17px; border: 1px solid {{r.btnBorder}}; background: {{r.btnBg}}; color: {{r.btnFg}}; font-size: 13px; font-weight: 700; padding: 0 14px">{{ r.btnLabel }}</button>
        </div>
        <div style="font-size: 14px; line-height: 20px; color: #C3C7D4">{{ r.topic }}</div>
      </article>
    </sc-for>
  </div>

  <nav aria-label="Main" style="height: 84px; border-top: 1px solid #262B37; background: #171A23; display: flex; padding: 8px 8px 24px; box-sizing: border-box">
    <a href="Rooms.dc.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; color: #8E94A6; font-size: 11px; font-weight: 500"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M4 5a3 3 0 0 1 3-3h10a3 3 0 0 1 3 3v9a3 3 0 0 1-3 3H10l-5 4v-4.2A3 3 0 0 1 4 14z"></path></svg>Rooms</a>
    <a href="Discover.dc.html" aria-current="page" style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; color: #8B8BFF; font-size: 11px; font-weight: 600"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm3.9 5.2-2.3 5.7a1.3 1.3 0 0 1-.7.7l-5.7 2.3 2.3-5.7a1.3 1.3 0 0 1 .7-.7z"></path></svg>Discover</a>
    <a href="Chat.dc.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; color: #8E94A6; font-size: 11px; font-weight: 500; position: relative"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M16 8v5a3 3 0 0 0 5 0v-1a9 9 0 1 0-3.5 7.1"></path></svg>Mentions<span style="position: absolute; top: -2px; left: 54%; min-width: 18px; height: 18px; border-radius: 9px; background: #FF8A7D; color: #0F1117; font-size: 10px; font-weight: 700; display: flex; align-items: center; justify-content: center; border: 2px solid #171A23; box-sizing: border-box">2</span></a>
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; color: #8E94A6; font-size: 11px; font-weight: 500"><span style="width: 24px; height: 24px; border-radius: 12px; background: #90CAF933; color: #90CAF9; font-size: 9px; font-weight: 700; display: flex; align-items: center; justify-content: center">DE</span>You</div>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
const ROOMS = [
  { name: '#flutter', cat: 'Tech', users: 142, lively: true, joined: true, topic: 'Flutter and Dart help. Be kind, share code with a paste link.', hue: '#8B8BFF' },
  { name: '#chillhop', cat: 'Music', users: 87, lively: true, topic: 'Lo-fi beats, what are you listening to right now?', hue: '#F48FB1' },
  { name: '#retrogaming', cat: 'Gaming', users: 311, lively: false, topic: 'Consoles, cartridges and speedruns from the 8 and 16-bit days.', hue: '#FFB74D' },
  { name: '#help', cat: 'Help', users: 1520, lively: true, topic: 'New to IRC? Ask anything here, friendly volunteers on hand.', hue: '#4DD0E1' },
  { name: '#linux', cat: 'Tech', users: 891, lively: false, joined: true, topic: 'General Linux help and chat.', hue: '#A5D6A7' },
  { name: '#coffee', cat: 'Social', users: 24, lively: false, topic: 'Small, slow, friendly. Pull up a chair.', hue: '#CE93D8' },
  { name: '#indiedev', cat: 'Gaming', users: 205, lively: true, topic: 'Making games on your own or in small teams. Share your progress.', hue: '#FF8A80' }
];
const CATS = ['Popular', 'Tech', 'Gaming', 'Music', 'Help', 'Social'];
const NETS = ['Libera.Chat', 'OFTC', 'EFnet'];

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { cat: 'Popular', net: 'Libera.Chat', joined: { '#flutter': true, '#linux': true } };
  }
  renderVals() {
    const s = this.state;
    const list = ROOMS.filter((r) => s.cat === 'Popular' || r.cat === s.cat)
      .sort((a, b) => b.users - a.users);
    return {
      networks: NETS.map((n) => ({
        label: n,
        pick: () => this.setState({ net: n }),
        bg: n === s.net ? '#8B8BFF29' : 'transparent',
        fg: n === s.net ? '#B8B8FF' : '#8E94A6',
        border: n === s.net ? '#8B8BFF' : '#262B37'
      })),
      cats: CATS.map((c) => ({
        label: c,
        pick: () => this.setState({ cat: c }),
        bg: c === s.cat ? '#8B8BFF' : '#232838',
        fg: c === s.cat ? '#0F1117' : '#E8EAF2'
      })),
      rooms: list.map((r) => {
        const on = !!s.joined[r.name];
        return Object.assign({}, r, {
          initial: r.name.charAt(1).toUpperCase(),
          avBg: r.hue + '29',
          avFg: r.hue,
          users: r.users.toLocaleString('en-US'),
          btnLabel: on ? 'Open' : 'Join',
          btnBg: on ? 'transparent' : '#8B8BFF',
          btnFg: on ? '#B8B8FF' : '#0F1117',
          btnBorder: on ? '#8B8BFF' : '#8B8BFF',
          toggle: () => this.setState({ joined: Object.assign({}, s.joined, { [r.name]: !on }) })
        });
      })
    };
  }
}
</script>
</body>
</html>
